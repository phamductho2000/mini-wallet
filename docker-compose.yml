services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pass
    ports: ["5432:5432"]
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  kafka:
    image: apache/kafka:3.8.0        # KRaft, không cần Zookeeper
    ports: ["9092:9092"]
    mem_limit: 512m
    cpus: 1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092   # INTERNAL: container gọi nhau, EXTERNAL: app chạy trên máy host
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_LOG_RETENTION_HOURS: 24          # giữ 1 ngày (mặc định 168 = 7 ngày)
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # tối đa ~1GB mỗi partition
      KAFKA_LOG_SEGMENT_BYTES: 67108864      # segment 64MB để xóa gọn hơn (mặc định 1GB)

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: [kafka]

  redis:
    image: redis:7
    ports: ["6379:6379"]
